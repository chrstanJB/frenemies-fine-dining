<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="tempLogo2.png">
    <link rel="stylesheet" href="FFD.css">
	<title>Frenemies Fine Dining</title>
    <script src="FFD.js" defer></script>
</head>
<body class="checkout-page">
	<header class="site-header">
            <div class="logo">
                <img src="tempLogo2.png" alt="Logo icon">
                <a href="FFD.html" class="returnMainPage">Frenemies Fine Dining</a>
            </div>

            <nav class="main-nav">
                <a href="ShopFFD.html">SHOP</a>
                <a href="AboutFFD.html">ABOUT</a>
                <a href="ReviewsFFD.html">REVIEWS</a>
                <a href="ContactFFD.html">CONTACT</a>
            </nav>

            <div class="header-acts">
                <button class="cart-btn" onclick="window.location.href='CartFFD.html'">
                    🛒
                    <span id="cartCount">0</span>
                </button>
                <button class="login-btn" onclick="window.location.href='LoginFFD.html'">Log In</button>
            </div>
    </header>

    <section class="checkout-content">

        <div class="checkout-left">
            <h1>Checkout</h1>
            <div class="checkout-progress">
                <div class="checkout-step done-step">
                    <div class="step-circle done">✓</div>
                    <span>Cart</span>
                </div>

                <div class="step-line"></div>

                <div class="checkout-step active-step">
                    <div class="step-circle current">2</div>
                    <span>Checkout</span>
                </div>

                <div class="step-line"></div>

                <div class="checkout-step">
                    <div class="step-circle">3</div>
                    <span>Payment</span>
                </div>

                <div class="step-line"></div>

                <div class="checkout-step">
                    <div class="step-circle">4</div>
                    <span>Confirm</span>
                </div>
            </div>
            
            <div class="delivery-box">
                <h2>Delivery Details</h2>
                <div class="form-grid">
                    <div class="input-group">
                        <label>FIRST NAME</label>
                        <input type="text" id="checkoutFirstName">
                    </div>
                    <div class="input-group">
                        <label>LAST NAME</label>
                        <input type="text" id="checkoutLastName" disabled>
                    </div>
                </div>

                    <div class="input-group">
                        <label>ADDRESS</label>
                        <input type="text" id="checkoutAddress" disabled>
                    </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>CITY</label>
                        <input type="text" id="checkoutCity" disabled>
                    </div>
                    <div class="input-group">
                        <label>ZIP CODE</label>
                        <input type="text" id="checkoutZip" disabled>
                    </div>
                </div>

                    <div class="input-group">
                        <label>PHONE NUMBER</label>
                        <input type="text" id="checkoutPhone" disabled>
                    </div>
            </div>
    </div>

    <div class="checkout-summary">
        <h2>Order Review</h2>

        <div id="checkoutItems"></div>

        <div class="checkout-summary-row">
            <span>Delivery</span>
            <span id="checkoutDelivery">₱0.00</span>
        </div>

        <div class="checkout-total">
            <span>Total</span>
            <span id="checkoutTotal">₱0.00</span>
        </div>

        <div class="checkout-review-btns">
            <button class="return-btn" onclick="window.location.href='CartFFD.html'">⟵ Return to Cart</button>
            <button class="proceed-btn" onclick="window.location.href='PaymentFFD.html'">Proceed to Payment ⟶</button>
       </div>

        <div class="checkout-rewards" id="checkoutRewards">
            
        </div>
    </div>
    </section>
</body>
</html>
