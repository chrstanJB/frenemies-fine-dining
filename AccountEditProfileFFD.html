<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/png" href="tempLogo2.png">
    <link rel="stylesheet" href="FFD.css">
	<title>Frenemies Fine Dining</title>
    <script src="FFD.js" defer></script>
</head>
<body class="auth-page">
	<header class="site-header">
            <div class="logo">
                <img src="tempLogo2.png" alt="Logo icon">
                <a href="FFD.html" class="returnMainPage">Frenemies Fine Dining</a>
            </div>

            <nav class="main-nav">
                <a href="ShopFFD.html">SHOP</a>
                <a href="AboutFFD.html">ABOUT</a>
                <a href="ReviewsFFD.html">REVIEWS</a>
                <a href="ContactFFD.html">CONTACT</a>
            </nav>

            <div class="header-acts">
                <button class="cart-btn" onclick="window.location.href='CartFFD.html'">
                🛒
                <span id="cartCount">0</span>
                </button>
                <button class="login-btn" onclick="window.location.href='LoginFFD.html'">Account</button>
            </div>
    </header>

    <div class="account-content">

    <aside class="account-sidebar">

        <div class="account-profile">
            <div class="account-avatar">😊</div>
            <h2 id="accountName"></h2>
            <p id="accountEmail"></p>

            <div class="pawcoins-box" id="pawCoinsBox"> </div>
        </div>

        <div class="account-menu">
            <button class="account-menu-btn" onclick="window.location.href='AccountFFD.html'">
               🎁 My Orders
            </button>
            <button class="account-menu-btn">
               <span class="account-menu-btn-paw-coin">⛃</span> Paw Coins
            </button>
            <button class="account-menu-btn active-account-tab" onclick="window.location.href='AccountEditProfileFFD.html'">
               👤 Edit Profile
            </button>
            <button class="account-menu-btn logout-btn" id="logoutBtn">
                ↩ Log Out
            </button>
        </div>

    </aside>

    <main class="account-main">
        <h1>Edit Profile</h1>
    <form id="editProfileForm" class="auth-form">

        <div class="form-grid">
            <div class="input-group">
                <label>FIRST NAME</label>
                <input type="text" id="editFirstName">
            </div>

            <div class="input-group">
                <label>LAST NAME</label>
                <input type="text" id="editLastName">
            </div>

        </div>

        <div class="input-group">
            <label>EMAIL</label>
            <input type="email" id="editEmail">
        </div>

        <div class="input-group">
            <label>PHONE</label>
            <input type="text" id="editPhone">
        </div>

        <hr style="border:1px solid #eee; margin:30px 0;">

        <div class="input-group">
            <label>NEW PASSWORD</label>
            <input type="password" id="editPassword" placeholder="Leave blank to keep current">
        </div>

        <div class="input-group">
            <label>CONFIRM NEW PASSWORD</label>
            <input type="password" id="editConfirmPassword" placeholder="Confirm new password">
        </div>

        <button type="submit" class="auth-submit" style="max-width:220px;">
            Save Changes
        </button>

    </form>
    
    </main>
    </div>
</body>
</html>
